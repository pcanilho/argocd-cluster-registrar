name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    timeout-minutes: 30
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Release notes come from CHANGELOG.md rather than from commit subjects,
      # so they are written deliberately and reviewed before tagging. A tag with
      # no matching section fails here instead of publishing an empty release.
      - name: Extract changelog section
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="$RUNNER_TEMP/notes.md"
          # Body of the matching '## [version]' section, stopping at the next
          # '## [' header or EOF. The header line itself is dropped, since the
          # release title already carries the version.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::No CHANGELOG.md section found for ${TAG} (looked for '## [${version}]'). Add the section before tagging."
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ steps.notes.outputs.notes_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Helm Chart
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          helm package deploy/charts/argocd-cluster-registrar --destination _build --version "$VERSION" --app-version "$VERSION"
          helm push _build/argocd-cluster-registrar-*.tgz oci://ghcr.io/pcanilho/charts
