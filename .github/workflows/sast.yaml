---
name: SAST
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      # Deliberately past the v2.29.0 tag, whose action.yml still pins the
      # 2.28.0 image: Go 1.26.5 with GOTOOLCHAIN=local, below the go.mod floor.
      # Upstream repinned it to the 2.29.0 image (Go 1.27.0) a day after tagging.
      # Dependabot tracks tags, so v2.30.0 will move this forward again.
      - name: Run Gosec Security Scanner
        uses: securego/gosec@57f161386e11e13e4c8a37255bc1a6502993d079 # post-v2.29.0
        with:
          args: ./...
