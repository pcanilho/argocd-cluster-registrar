name: Test

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - docs/**
      - LICENSE
      - .gitignore
    branches:
      - main
      - release-*
  # Also on push to main, so a merge that breaks something is caught even when
  # the PR was green against an older base.
  push:
    branches:
      - main

env:
  GO_VERSION: 'stable'
  # Must be v2+. golangci-lint-action v9 rejects v1 outright
  # ("golangci-lint v1 is not supported by golangci-lint-action >= v7"), so the
  # previous 'v1.60' meant the lint job could never start.
  GOLANGCI_VERSION: 'v2.12'

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true
          version: ${{ env.GOLANGCI_VERSION }}
          github-token: ${{ github.token }}

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # There was no test step at all before, while the destructive paths
      # (garbage collection especially) carry the tests that matter most.
      - name: Test
        run: go test -race -cover ./...

  chart:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Rendering with defaults is not enough. commonLabels and commonAnnotations
      # default to empty, so a template that only breaks when they are SET passed
      # lint for as long as nobody set them.
      - name: Lint chart across value combinations
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          helm lint "$chart"
          helm lint "$chart" --set commonLabels.team=platform
          helm lint "$chart" --set commonAnnotations.owner=infra
          # The deprecated single-provider form, exactly as a 0.2.x values file
          # would express it: the old scalars and NO mention of providers.
          helm lint "$chart" \
            --set commonLabels.a=b \
            --set commonAnnotations.c=d \
            --set labelPrefix=example.com/ \
            --set secretNamePattern='vc-*' \
            --set secretKey=config
          # Several presets at once, which is the point of 0.3.0.
          helm lint "$chart" \
            --set 'providers[0]=k3k' \
            --set 'providers[1]=kamaji' \
            --set 'providers[2]=capi'
          # A custom shape spelled out in full, including a multi-key list.
          helm lint "$chart" \
            --set 'providers[0]=k3k' \
            --set 'providers[1].name=mytool' \
            --set 'providers[1].secretNamePattern=mytool-*-kubeconfig' \
            --set 'providers[1].secretKeys={admin.conf,admin.svc}'

      # A 0.2.x values file sets the old scalars and says nothing about
      # `providers`. Helm still coalesces the chart default in, so if that default
      # is non-empty the legacy branch is unreachable and the user's settings are
      # dropped without a word: the pod looks healthy and registers nothing. This
      # is the regression test for that.
      - name: A 0.2.x values file still renders the deprecated flags
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          cat <<'EOF' > /tmp/legacy-values.yaml
          secretNamePattern: "vc-*"
          secretKey: config
          EOF
          out=$(helm template t "$chart" -f /tmp/legacy-values.yaml)
          grep -q -- "--secret-name-pattern=vc-\*" <<<"$out" || {
            echo "::error::a 0.2.x values file no longer renders its own settings"
            grep -- '--' <<<"$out"; exit 1
          }
          grep -q -- '--secret-key=config' <<<"$out"
          if grep -q -- '--provider=' <<<"$out"; then
            echo "::error::chart injected a default provider over the user's legacy settings"
            exit 1
          fi

      # Setting both forms is ambiguous, and quietly honouring either one is how an
      # upgrade ends up looking healthy while registering nothing. The chart must
      # fail rather than choose.
      - name: Setting both provider forms fails the render
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          if helm template t "$chart" --set 'providers[0]=k3k' \
               --set secretNamePattern='vc-*' --set secretKey=config >/dev/null 2>&1; then
            echo "::error::chart rendered with both provider forms set; it must fail"
            exit 1
          fi

      # With neither set, the chart must emit no provider flags at all and let the
      # binary apply its own default. Emitting one here is what broke the case above.
      - name: A default install emits no provider flags
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          out=$(helm template t "$chart")
          if grep -qE -- '--provider=|--secret-name-pattern=|--secret-key=' <<<"$out"; then
            echo "::error::default install should defer to the binary's own default"
            grep -- '--' <<<"$out"; exit 1
          fi

  deploy-test:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ko-build/setup-ko@v0.9

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      # Build locally rather than pulling from GHCR, so the test does not depend
      # on a release having happened first.
      - name: Build and load image
        id: image
        run: |
          set -euo pipefail
          img=$(KO_DOCKER_REPO=ko.local ko build --bare --tags ci --platform linux/amd64 .)
          kind load docker-image "$img" --name chart-testing
          echo "ref=$img" >> "$GITHUB_OUTPUT"

      # Two synthetic children in DIFFERENT shapes: one as k3k writes it, one as
      # the Cluster API contract requires. This exercises the real contract
      # without waiting on a provisioner to boot, and proves a single instance
      # serves a mixed fleet -- which was impossible before 0.3.0.
      - name: Seed fake child clusters
        run: |
          set -euo pipefail
          kubectl create namespace argocd

          kubectl create namespace k3k-sandbox
          kubectl label namespace k3k-sandbox \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=sandbox
          cat <<'EOF' > /tmp/kubeconfig.yaml
          apiVersion: v1
          kind: Config
          clusters:
          - name: sandbox
            cluster:
              server: https://192.0.2.10
              certificate-authority-data: Y2FkYXRh
          users:
          - name: sandbox
            user:
              client-certificate-data: Y2VydGRhdGE=
              client-key-data: a2V5ZGF0YQ==
          EOF
          kubectl create secret generic k3k-sandbox-kubeconfig \
            -n k3k-sandbox --from-file=kubeconfig.yaml=/tmp/kubeconfig.yaml

          # CAPI shape: `<cluster>-kubeconfig`, key `value`, multiple entries
          # with an explicit current-context.
          kubectl create namespace capi-child
          kubectl label namespace capi-child \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=capichild
          cat <<'EOF' > /tmp/value
          apiVersion: v1
          kind: Config
          clusters:
          - name: capichild
            cluster:
              server: https://192.0.2.20
              certificate-authority-data: Y2FkYXRh
          users:
          - name: capichild-admin
            user:
              client-certificate-data: Y2VydGRhdGE=
              client-key-data: a2V5ZGF0YQ==
          contexts:
          - name: capichild-admin@capichild
            context:
              cluster: capichild
              user: capichild-admin
          current-context: capichild-admin@capichild
          EOF
          kubectl create secret generic capichild-kubeconfig \
            -n capi-child --from-file=value=/tmp/value

      - name: Install the chart
        run: |
          set -euo pipefail
          helm install registrar ./deploy/charts/argocd-cluster-registrar \
            --namespace registrar --create-namespace \
            --set image.repository="$(echo '${{ steps.image.outputs.ref }}' | cut -d: -f1)" \
            --set image.tag="$(echo '${{ steps.image.outputs.ref }}' | cut -d: -f2)" \
            --set image.pullPolicy=IfNotPresent \
            --set 'providers[0]=k3k' \
            --set 'providers[1]=capi' \
            --set interval=5s \
            --wait --timeout 3m

      # Assertions are real: no `|| echo "Ignored..."`, so a regression fails CI.
      - name: It registers both shapes, under one instance
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if kubectl get secret cluster-sandbox -n argocd >/dev/null 2>&1 \
               && kubectl get secret cluster-capichild -n argocd >/dev/null 2>&1; then
              echo "both registered after ${i}0s"
              kubectl get secret cluster-sandbox -n argocd -o jsonpath='{.metadata.labels}'; echo
              kubectl get secret cluster-capichild -n argocd -o jsonpath='{.metadata.labels}'; echo
              test "$(kubectl get secret cluster-sandbox -n argocd -o jsonpath='{.data.server}' | base64 -d)" = "https://192.0.2.10"
              test "$(kubectl get secret cluster-capichild -n argocd -o jsonpath='{.data.server}' | base64 -d)" = "https://192.0.2.20"
              # The provider label is what makes a mixed fleet introspectable.
              test "$(kubectl get secret cluster-sandbox -n argocd -o jsonpath='{.metadata.labels.argocd-cluster-registrar/provider}')" = "k3k"
              test "$(kubectl get secret cluster-capichild -n argocd -o jsonpath='{.metadata.labels.argocd-cluster-registrar/provider}')" = "capi"
              exit 0
            fi
            sleep 10
          done
          echo "::error::both cluster Secrets were never created"
          kubectl get secrets -n argocd
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1

      # Collection must be per-cluster. Deleting one child must not disturb the
      # other, and -- before 0.3.0 -- one unevaluable namespace suppressed GC for
      # the entire fleet.
      - name: It deregisters only the cluster whose namespace is gone
        run: |
          set -euo pipefail
          kubectl delete namespace k3k-sandbox --wait=true
          for i in $(seq 1 30); do
            if ! kubectl get secret cluster-sandbox -n argocd >/dev/null 2>&1; then
              echo "deregistered after ${i}0s"
              if ! kubectl get secret cluster-capichild -n argocd >/dev/null 2>&1; then
                echo "::error::cluster-capichild was collected too; GC is not per-cluster"
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::cluster-sandbox was never garbage collected"
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1

      # A Secret that matches the shape but does not parse must never look like a
      # deletion, and must not stop OTHER clusters being collected. A starting k3k
      # child is in exactly this state for roughly its first ninety seconds.
      - name: A half-written kubeconfig neither deregisters nor blocks GC
        run: |
          set -euo pipefail
          kubectl create namespace k3k-broken
          kubectl label namespace k3k-broken \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=broken
          printf '<html>not a kubeconfig</html>' > /tmp/broken
          kubectl create secret generic k3k-broken-kubeconfig \
            -n k3k-broken --from-file=kubeconfig.yaml=/tmp/broken
          sleep 20
          if kubectl get secret cluster-broken -n argocd >/dev/null 2>&1; then
            echo "::error::an unparseable kubeconfig was registered"
            exit 1
          fi
          # The still-healthy child must remain registered throughout.
          kubectl get secret cluster-capichild -n argocd >/dev/null

          # ...and GC must still work for everything else while it is stuck.
          kubectl delete namespace capi-child --wait=true
          for i in $(seq 1 24); do
            if ! kubectl get secret cluster-capichild -n argocd >/dev/null 2>&1; then
              echo "collected despite a stuck namespace, after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::a stuck namespace suppressed garbage collection for the fleet"
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1

      # The escalation closed in 0.4.0. apply() used to overwrite and relabel any
      # pre-existing cluster-<name>, so labelling a namespace was enough to
      # repoint someone else's registration at your own API server. The fake
      # clientset cannot prove this against a real apiserver.
      - name: It refuses to take over a cluster Secret it does not own
        run: |
          set -euo pipefail
          kubectl create secret generic cluster-hand -n argocd \
            --from-literal=name=hand \
            --from-literal=server=https://198.51.100.1 \
            --from-literal=config='{"bearerToken":"handmade"}'
          kubectl label secret cluster-hand -n argocd \
            argocd.argoproj.io/secret-type=cluster

          kubectl create namespace tenant-hand
          kubectl label namespace tenant-hand \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=hand
          sed 's|https://192.0.2.10|https://203.0.113.9|' /tmp/kubeconfig.yaml > /tmp/hand.yaml
          kubectl create secret generic k3k-hand-kubeconfig \
            -n tenant-hand --from-file=kubeconfig.yaml=/tmp/hand.yaml

          sleep 20
          server="$(kubectl get secret cluster-hand -n argocd -o jsonpath='{.data.server}' | base64 -d)"
          if [ "$server" != "https://198.51.100.1" ]; then
            echo "::error::a hand-registered cluster Secret was repointed to ${server}"
            kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=30
            exit 1
          fi
          if kubectl get secret cluster-hand -n argocd \
               -o jsonpath='{.metadata.labels.argocd-cluster-registrar/managed-by}' | grep -q .; then
            echo "::error::a hand-registered cluster Secret was relabelled as ours"
            exit 1
          fi
          kubectl delete namespace tenant-hand --wait=true
          kubectl delete secret cluster-hand -n argocd

      # Two namespaces claiming one name: the OLDER wins, and the winner must not
      # flap afterwards. `zzz-` is created first precisely so that alphabetical
      # order would give the wrong answer.
      - name: A contested cluster name goes to the oldest namespace and stays there
        run: |
          set -euo pipefail
          create_claimant() {
            ns="$1"; addr="$2"
            kubectl create namespace "$ns"
            kubectl label namespace "$ns" \
              argocd-cluster-registrar/managed-by=cluster-registrar \
              argocd-cluster-registrar/cluster=contested
            sed "s|https://192.0.2.10|https://192.0.2.${addr}|" \
              /tmp/kubeconfig.yaml > /tmp/"$ns".yaml
            kubectl create secret generic "k3k-$ns-kubeconfig" \
              -n "$ns" --from-file=kubeconfig.yaml=/tmp/"$ns".yaml
          }
          create_claimant zzz-first 31
          # Distinct creation timestamps; the API stores whole seconds.
          sleep 2
          create_claimant aaa-second 32

          sleep 20
          count="$(kubectl get secret -n argocd \
            -l argocd-cluster-registrar/cluster=contested -o name | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one registration for the contested name, got ${count}"
            kubectl get secret -n argocd -l argocd-cluster-registrar/cluster=contested
            exit 1
          fi
          owner() {
            kubectl get secret cluster-contested -n argocd \
              -o jsonpath='{.metadata.labels.argocd-cluster-registrar/source-namespace}'
          }
          if [ "$(owner)" != "zzz-first" ]; then
            echo "::error::contested name went to $(owner), want the older zzz-first"
            exit 1
          fi
          # Several intervals later it must still be the same winner: the pod has
          # no persistent state, so a re-elected winner would show up here.
          sleep 20
          if [ "$(owner)" != "zzz-first" ]; then
            echo "::error::the winner flapped to $(owner)"
            exit 1
          fi
          # The registrar must stay up. There are no probes, so pod-Ready means
          # only "container running"; restarts are the real signal.
          restarts="$(kubectl get pods -n registrar \
            -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}' | tr -d ' ')"
          if [ "$restarts" != "0" ]; then
            echo "::error::registrar restarted ${restarts} times while refusing a claim"
            kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
            exit 1
          fi
          kubectl delete namespace aaa-second --wait=true

      # Renaming demotes the old registration rather than deleting it. Worth doing
      # live because a real apiserver validates label values, and the demotion
      # stamps a timestamp -- RFC 3339 would be rejected for its colons.
      - name: A renamed cluster demotes its old registration, reversibly
        run: |
          set -euo pipefail
          kubectl label --overwrite namespace zzz-first \
            argocd-cluster-registrar/cluster=renamed
          for i in $(seq 1 12); do
            if kubectl get secret cluster-renamed -n argocd >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl get secret cluster-renamed -n argocd >/dev/null

          old="$(kubectl get secret cluster-contested -n argocd -o json)"
          if echo "$old" | jq -e '.metadata.labels."argocd.argoproj.io/secret-type"' >/dev/null; then
            echo "::error::the superseded registration is still visible to ArgoCD"
            exit 1
          fi
          echo "$old" | jq -e '.metadata.labels."argocd-cluster-registrar/superseded-by" == "cluster-renamed"' >/dev/null
          echo "$old" | jq -e '.metadata.labels."argocd-cluster-registrar/stale-since"' >/dev/null

          # Revert: the demoted registration must come back, not be recreated.
          kubectl label --overwrite namespace zzz-first \
            argocd-cluster-registrar/cluster=contested
          for i in $(seq 1 12); do
            if kubectl get secret cluster-contested -n argocd \
                 -o jsonpath='{.metadata.labels.argocd\.argoproj\.io/secret-type}' | grep -q cluster; then
              echo "restored after $((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::a reverted rename did not restore the demoted registration"
          kubectl get secret cluster-contested -n argocd -o jsonpath='{.metadata.labels}'; echo
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1
