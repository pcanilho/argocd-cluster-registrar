name: Test

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - docs/**
      - LICENSE
      - .gitignore
    branches:
      - main
      - release-*
  # Also on push to main, so a merge that breaks something is caught even when
  # the PR was green against an older base.
  push:
    branches:
      - main

env:
  GO_VERSION: 'stable'
  # Must be v2+. golangci-lint-action v9 rejects v1 outright
  # ("golangci-lint v1 is not supported by golangci-lint-action >= v7"), so the
  # previous 'v1.60' meant the lint job could never start.
  GOLANGCI_VERSION: 'v2.12'

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true
          version: ${{ env.GOLANGCI_VERSION }}
          github-token: ${{ github.token }}

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # envtest, so the tests that need a real apiserver are not silently skipped.
      # Pinned to controller-runtime's release branch rather than @latest: the
      # tool and the library move together.
      - name: Set up envtest
        run: |
          set -euo pipefail
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path)" >> "$GITHUB_ENV"

      # There was no test step at all before, while the destructive paths
      # (garbage collection especially) carry the tests that matter most.
      - name: Test
        run: go test -race -cover ./...

      # A test that skips is indistinguishable from a test that passes, and the
      # envtest cases skip themselves when KUBEBUILDER_ASSETS is unset. So assert
      # they RAN, rather than trusting the exit code of the step above.
      - name: The envtest cases actually ran
        run: |
          set -euo pipefail
          go test ./internal/registrar/ -run 'TestAStranded' -v -timeout 5m | tee /tmp/envtest.log
          if ! grep -q -- '--- PASS: TestAStrandedRegistrationIsCollectedOnStartup' /tmp/envtest.log; then
            echo "::error::the envtest case did not run; it was skipped or renamed"
            grep -E -- '--- (PASS|SKIP|FAIL)' /tmp/envtest.log || true
            exit 1
          fi

      # Metrics were deferred for a release because securing the endpoint pulls in
      # k8s.io/apiserver and its cel-go/gRPC/OTel arm. One import of
      # controller-runtime's pkg/metrics/filters brings all of it back, so assert
      # the absence rather than trusting review. -deps excludes test-only imports,
      # which is why an envtest dependency cannot trip this.
      - name: The apiserver authn/authz arm stays out of the binary
        run: |
          set -euo pipefail
          if go list -deps ./... | grep -q '^k8s.io/apiserver'; then
            echo "::error::k8s.io/apiserver is linked; pkg/metrics/filters was probably imported"
            go list -deps ./... | grep '^k8s.io/apiserver' | head -20
            exit 1
          fi

  chart:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The chart-version guard compares against the latest tag.
          fetch-depth: 0

      # Rendering with defaults is not enough. commonLabels and commonAnnotations
      # default to empty, so a template that only breaks when they are SET passed
      # lint for as long as nobody set them.
      - name: Lint chart across value combinations
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          helm lint "$chart"
          helm lint "$chart" --set commonLabels.team=platform
          helm lint "$chart" --set commonAnnotations.owner=infra
          # The deprecated single-provider form, exactly as a 0.2.x values file
          # would express it: the old scalars and NO mention of providers.
          helm lint "$chart" \
            --set commonLabels.a=b \
            --set commonAnnotations.c=d \
            --set labelPrefix=example.com/ \
            --set secretNamePattern='vc-*' \
            --set secretKey=config
          # Several presets at once, which is the point of 0.3.0.
          helm lint "$chart" \
            --set 'providers[0]=k3k' \
            --set 'providers[1]=kamaji' \
            --set 'providers[2]=capi'
          # A custom shape spelled out in full, including a multi-key list.
          helm lint "$chart" \
            --set 'providers[0]=k3k' \
            --set 'providers[1].name=mytool' \
            --set 'providers[1].secretNamePattern=mytool-*-kubeconfig' \
            --set 'providers[1].secretKeys={admin.conf,admin.svc}'
          # The 0.4.0 operational surface.
          helm lint "$chart" --set leaderElection.enabled=true
          helm lint "$chart" --set probes.enabled=false
          helm lint "$chart" --set replicaCount=2 --set leaderElection.enabled=true
          # The 0.5.0 operational surface.
          helm lint "$chart" --set metrics.enabled=true
          helm lint "$chart" --set metrics.enabled=true --set metrics.service.enabled=true
          helm lint "$chart" --set metrics.enabled=true --set probes.enabled=false
          helm lint "$chart" --set demotedTTL=720h

      # Two active replicas do not corrupt each other, but they do the work twice
      # and rewrite each other's provider label when configured differently.
      # Leader election is what makes more than one safe, so asking for more
      # without it must fail rather than quietly misbehave.
      - name: More than one replica without leader election fails the render
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          if helm template t "$chart" --set replicaCount=2 >/dev/null 2>&1; then
            echo "::error::chart rendered 2 replicas without leader election"
            exit 1
          fi

      # Chart.yaml sat at 0.2.0 while the latest tag was v0.3.0 for two releases.
      # The release workflow overrides it at package time so published charts were
      # fine, but `helm install` from a checkout pulled a stale image, and nothing
      # noticed because deploy-test overrides the tag explicitly.
      - name: The in-tree chart version is not behind the latest tag
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          chart_version=$(grep -E '^version:' "$chart/Chart.yaml" | awk '{print $2}')
          app_version=$(grep -E '^appVersion:' "$chart/Chart.yaml" | tr -d '"' | awk '{print $2}')
          if [ "$chart_version" != "$app_version" ]; then
            echo "::error::Chart.yaml version ($chart_version) and appVersion ($app_version) disagree"
            exit 1
          fi
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$latest" ]; then
            echo "no tags yet, nothing to compare against"
            exit 0
          fi
          oldest=$(printf '%s\n%s\n' "$chart_version" "$latest" | sort -V | head -1)
          if [ "$chart_version" != "$latest" ] && [ "$oldest" = "$chart_version" ]; then
            echo "::error::Chart.yaml is $chart_version but the latest tag is $latest; a local install would pull a stale image"
            exit 1
          fi

      # A 0.2.x values file sets the old scalars and says nothing about
      # `providers`. Helm still coalesces the chart default in, so if that default
      # is non-empty the legacy branch is unreachable and the user's settings are
      # dropped without a word: the pod looks healthy and registers nothing. This
      # is the regression test for that.
      - name: A 0.2.x values file still renders the deprecated flags
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          cat <<'EOF' > /tmp/legacy-values.yaml
          secretNamePattern: "vc-*"
          secretKey: config
          EOF
          out=$(helm template t "$chart" -f /tmp/legacy-values.yaml)
          grep -q -- "--secret-name-pattern=vc-\*" <<<"$out" || {
            echo "::error::a 0.2.x values file no longer renders its own settings"
            grep -- '--' <<<"$out"; exit 1
          }
          grep -q -- '--secret-key=config' <<<"$out"
          if grep -q -- '--provider=' <<<"$out"; then
            echo "::error::chart injected a default provider over the user's legacy settings"
            exit 1
          fi

      # Setting both forms is ambiguous, and quietly honouring either one is how an
      # upgrade ends up looking healthy while registering nothing. The chart must
      # fail rather than choose.
      - name: Setting both provider forms fails the render
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          if helm template t "$chart" --set 'providers[0]=k3k' \
               --set secretNamePattern='vc-*' --set secretKey=config >/dev/null 2>&1; then
            echo "::error::chart rendered with both provider forms set; it must fail"
            exit 1
          fi

      # With neither set, the chart must emit no provider flags at all and let the
      # binary apply its own default. Emitting one here is what broke the case above.
      - name: A default install emits no provider flags
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          out=$(helm template t "$chart")
          if grep -qE -- '--provider=|--secret-name-pattern=|--secret-key=' <<<"$out"; then
            echo "::error::default install should defer to the binary's own default"
            grep -- '--' <<<"$out"; exit 1
          fi

      # `0s` is a truthy string in a Go template and `0` is a falsy int, so a
      # conditional here renders opposite results for the same intent. The flag is
      # emitted unconditionally; this pins that.
      - name: demotedTTL renders the same disabled value however it is spelled
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          for v in "" "--set demotedTTL=0" "--set demotedTTL=0s"; do
            got=$(helm template t "$chart" $v | grep -o -- '--demoted-ttl=[^"]*')
            if [ "$got" != "--demoted-ttl=0s" ]; then
              echo "::error::demotedTTL ${v:-<default>} rendered ${got}, want --demoted-ttl=0s"
              exit 1
            fi
          done
          helm template t "$chart" --set demotedTTL=720h \
            | grep -q -- '--demoted-ttl=720h' || {
            echo "::error::a configured demotedTTL did not reach the pod"; exit 1; }

      # An empty --metrics-bind-address means ":8080" to controller-runtime, not
      # "off", so the default install must emit no such flag at all rather than an
      # empty one. Nor a Service, which would put a stable name in front of an
      # unauthenticated port nobody asked for.
      - name: A default install serves no metrics
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          out=$(helm template t "$chart")
          if grep -q -- '--metrics-bind-address' <<<"$out"; then
            echo "::error::the default install passes a metrics bind address"
            grep -- '--' <<<"$out"; exit 1
          fi
          if grep -q '^kind: Service$' <<<"$out"; then
            echo "::error::the default install renders a Service"
            exit 1
          fi

      # And when asked for, all three parts must appear together: the flag, the
      # container port the Service targets by name, and the Service itself.
      - name: Enabling metrics renders the flag, the port and the Service
        run: |
          set -euo pipefail
          chart=deploy/charts/argocd-cluster-registrar
          out=$(helm template t "$chart" \
            --set metrics.enabled=true --set metrics.service.enabled=true)
          grep -q -- '--metrics-bind-address=:8080' <<<"$out" || {
            echo "::error::metrics were enabled but no bind address was passed"; exit 1; }
          grep -q 'name: metrics' <<<"$out" || {
            echo "::error::no metrics container port"; exit 1; }
          grep -q '^kind: Service$' <<<"$out" || {
            echo "::error::no Service"; exit 1; }
          # Rendering the ports key twice yields a manifest where the second one
          # silently wins, which is what a naive second entry under the probes
          # conditional would have produced.
          if [ "$(grep -c '^          ports:$' <<<"$out")" != "1" ]; then
            echo "::error::the container has more than one ports: key"
            exit 1
          fi

  deploy-test:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ko-build/setup-ko@v0.9

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      # Build locally rather than pulling from GHCR, so the test does not depend
      # on a release having happened first.
      - name: Build and load image
        id: image
        run: |
          set -euo pipefail
          img=$(KO_DOCKER_REPO=ko.local ko build --bare --tags ci --platform linux/amd64 .)
          kind load docker-image "$img" --name chart-testing
          echo "ref=$img" >> "$GITHUB_OUTPUT"

      # Two synthetic children in DIFFERENT shapes: one as k3k writes it, one as
      # the Cluster API contract requires. This exercises the real contract
      # without waiting on a provisioner to boot, and proves a single instance
      # serves a mixed fleet -- which was impossible before 0.3.0.
      - name: Seed fake child clusters
        run: |
          set -euo pipefail
          kubectl create namespace argocd

          kubectl create namespace k3k-sandbox
          kubectl label namespace k3k-sandbox \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=sandbox
          cat <<'EOF' > /tmp/kubeconfig.yaml
          apiVersion: v1
          kind: Config
          clusters:
          - name: sandbox
            cluster:
              server: https://192.0.2.10
              certificate-authority-data: Y2FkYXRh
          users:
          - name: sandbox
            user:
              client-certificate-data: Y2VydGRhdGE=
              client-key-data: a2V5ZGF0YQ==
          EOF
          kubectl create secret generic k3k-sandbox-kubeconfig \
            -n k3k-sandbox --from-file=kubeconfig.yaml=/tmp/kubeconfig.yaml

          # CAPI shape: `<cluster>-kubeconfig`, key `value`, multiple entries
          # with an explicit current-context.
          kubectl create namespace capi-child
          kubectl label namespace capi-child \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=capichild
          cat <<'EOF' > /tmp/value
          apiVersion: v1
          kind: Config
          clusters:
          - name: capichild
            cluster:
              server: https://192.0.2.20
              certificate-authority-data: Y2FkYXRh
          users:
          - name: capichild-admin
            user:
              client-certificate-data: Y2VydGRhdGE=
              client-key-data: a2V5ZGF0YQ==
          contexts:
          - name: capichild-admin@capichild
            context:
              cluster: capichild
              user: capichild-admin
          current-context: capichild-admin@capichild
          EOF
          kubectl create secret generic capichild-kubeconfig \
            -n capi-child --from-file=value=/tmp/value

      - name: Install the chart
        run: |
          set -euo pipefail
          helm install registrar ./deploy/charts/argocd-cluster-registrar \
            --namespace registrar --create-namespace \
            --set image.repository="$(echo '${{ steps.image.outputs.ref }}' | cut -d: -f1)" \
            --set image.tag="$(echo '${{ steps.image.outputs.ref }}' | cut -d: -f2)" \
            --set image.pullPolicy=IfNotPresent \
            --set 'providers[0]=k3k' \
            --set 'providers[1]=capi' \
            --set interval=5s \
            --set metrics.enabled=true \
            --set metrics.service.enabled=true \
            --wait --timeout 3m

      # Assertions are real: no `|| echo "Ignored..."`, so a regression fails CI.
      - name: It registers both shapes, under one instance
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if kubectl get secret cluster-sandbox -n argocd >/dev/null 2>&1 \
               && kubectl get secret cluster-capichild -n argocd >/dev/null 2>&1; then
              echo "both registered after ${i}0s"
              kubectl get secret cluster-sandbox -n argocd -o jsonpath='{.metadata.labels}'; echo
              kubectl get secret cluster-capichild -n argocd -o jsonpath='{.metadata.labels}'; echo
              test "$(kubectl get secret cluster-sandbox -n argocd -o jsonpath='{.data.server}' | base64 -d)" = "https://192.0.2.10"
              test "$(kubectl get secret cluster-capichild -n argocd -o jsonpath='{.data.server}' | base64 -d)" = "https://192.0.2.20"
              # The provider label is what makes a mixed fleet introspectable.
              test "$(kubectl get secret cluster-sandbox -n argocd -o jsonpath='{.metadata.labels.argocd-cluster-registrar/provider}')" = "k3k"
              test "$(kubectl get secret cluster-capichild -n argocd -o jsonpath='{.metadata.labels.argocd-cluster-registrar/provider}')" = "capi"
              exit 0
            fi
            sleep 10
          done
          echo "::error::both cluster Secrets were never created"
          kubectl get secrets -n argocd
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1

      # Collection must be per-cluster. Deleting one child must not disturb the
      # other, and -- before 0.3.0 -- one unevaluable namespace suppressed GC for
      # the entire fleet.
      - name: It deregisters only the cluster whose namespace is gone
        run: |
          set -euo pipefail
          kubectl delete namespace k3k-sandbox --wait=true
          for i in $(seq 1 30); do
            if ! kubectl get secret cluster-sandbox -n argocd >/dev/null 2>&1; then
              echo "deregistered after ${i}0s"
              if ! kubectl get secret cluster-capichild -n argocd >/dev/null 2>&1; then
                echo "::error::cluster-capichild was collected too; GC is not per-cluster"
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::cluster-sandbox was never garbage collected"
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1

      # A Secret that matches the shape but does not parse must never look like a
      # deletion, and must not stop OTHER clusters being collected. A starting k3k
      # child is in exactly this state for roughly its first ninety seconds.
      - name: A half-written kubeconfig neither deregisters nor blocks GC
        run: |
          set -euo pipefail
          kubectl create namespace k3k-broken
          kubectl label namespace k3k-broken \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=broken
          printf '<html>not a kubeconfig</html>' > /tmp/broken
          kubectl create secret generic k3k-broken-kubeconfig \
            -n k3k-broken --from-file=kubeconfig.yaml=/tmp/broken
          sleep 20
          if kubectl get secret cluster-broken -n argocd >/dev/null 2>&1; then
            echo "::error::an unparseable kubeconfig was registered"
            exit 1
          fi
          # The still-healthy child must remain registered throughout.
          kubectl get secret cluster-capichild -n argocd >/dev/null

          # ...and GC must still work for everything else while it is stuck.
          kubectl delete namespace capi-child --wait=true
          for i in $(seq 1 24); do
            if ! kubectl get secret cluster-capichild -n argocd >/dev/null 2>&1; then
              echo "collected despite a stuck namespace, after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::a stuck namespace suppressed garbage collection for the fleet"
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1

      # The controller must not watch Secrets. A cluster-wide Secret informer is
      # what this design deliberately avoids -- it could not be narrowed, since
      # the provisioner-written Secrets carry none of our labels. Asserting on
      # RBAC rather than on manager options is stronger: the pod physically
      # cannot start that informer, whatever the code later says.
      - name: It can read Secrets but never watch them
        run: |
          set -euo pipefail
          # NOT `head -1`: every namespace has a `default` ServiceAccount and it
          # sorts before ours, so that silently tested the wrong identity.
          name=$(kubectl get sa -n registrar -o name \
            | grep argocd-cluster-registrar | head -1 | cut -d/ -f2)
          test -n "$name"
          sa="system:serviceaccount:registrar:$name"
          echo "asserting against $sa"
          test "$(kubectl auth can-i list secrets --all-namespaces --as="$sa")" = "yes"
          # Reads of the provisioner-written Secrets are LISTs; every Get this tool
          # issues is inside targetNamespace and covered by the namespaced Role.
          if [ "$(kubectl auth can-i get secrets --all-namespaces --as="$sa")" != "no" ]; then
            echo "::error::cluster-wide get on secrets is granted and never used"
            exit 1
          fi
          if [ "$(kubectl auth can-i watch secrets --all-namespaces --as="$sa")" != "no" ]; then
            echo "::error::the ServiceAccount can watch Secrets cluster-wide"
            exit 1
          fi
          # ...and it must be able to watch namespaces, or nothing is event-driven.
          test "$(kubectl auth can-i watch namespaces --as="$sa")" = "yes"

      # An owned Secret whose source-namespace label is stripped matches no
      # collection selector and routes to no key, so nothing would ever mention it
      # again. That is the one observability regression the migration could cause.
      - name: It reports registrations that can never be collected
        run: |
          set -euo pipefail
          kubectl create namespace k3k-audit
          kubectl label namespace k3k-audit \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=audited
          sed 's|https://192.0.2.10|https://192.0.2.41|' /tmp/kubeconfig.yaml > /tmp/audit.yaml
          kubectl create secret generic k3k-audit-kubeconfig \
            -n k3k-audit --from-file=kubeconfig.yaml=/tmp/audit.yaml
          for i in $(seq 1 12); do
            if kubectl get secret cluster-audited -n argocd >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl get secret cluster-audited -n argocd >/dev/null

          # Delete the namespace FIRST. While it exists, its own reconcile reaches
          # the orphan-adoption branch, restores source-namespace within seconds,
          # and the Secret is routable again before the audit ever looks at it.
          kubectl delete namespace k3k-audit --wait=true
          kubectl label secret cluster-audited -n argocd \
            argocd-cluster-registrar/source-namespace-
          kubectl rollout restart deployment -n registrar registrar-argocd-cluster-registrar
          kubectl rollout status deployment -n registrar registrar-argocd-cluster-registrar --timeout=2m
          for i in $(seq 1 12); do
            # Grep the distinctive half: "records no source namespace" also appears
            # in the adoption warning, which would make this pass without the audit
            # having run at all.
            if kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar \
                 | grep -q 'it can never be collected'; then
              echo "audit reported it after $((i*5))s"
              kubectl delete secret cluster-audited -n argocd
              exit 0
            fi
            sleep 5
          done
          echo "::error::an unroutable registration was never reported"
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1

      # The escalation closed in 0.4.0. apply() used to overwrite and relabel any
      # pre-existing cluster-<name>, so labelling a namespace was enough to
      # repoint someone else's registration at your own API server. The fake
      # clientset cannot prove this against a real apiserver.
      - name: It refuses to take over a cluster Secret it does not own
        run: |
          set -euo pipefail
          kubectl create secret generic cluster-hand -n argocd \
            --from-literal=name=hand \
            --from-literal=server=https://198.51.100.1 \
            --from-literal=config='{"bearerToken":"handmade"}'
          kubectl label secret cluster-hand -n argocd \
            argocd.argoproj.io/secret-type=cluster

          kubectl create namespace tenant-hand
          kubectl label namespace tenant-hand \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=hand
          sed 's|https://192.0.2.10|https://203.0.113.9|' /tmp/kubeconfig.yaml > /tmp/hand.yaml
          kubectl create secret generic k3k-hand-kubeconfig \
            -n tenant-hand --from-file=kubeconfig.yaml=/tmp/hand.yaml

          sleep 20
          server="$(kubectl get secret cluster-hand -n argocd -o jsonpath='{.data.server}' | base64 -d)"
          if [ "$server" != "https://198.51.100.1" ]; then
            echo "::error::a hand-registered cluster Secret was repointed to ${server}"
            kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=30
            exit 1
          fi
          if kubectl get secret cluster-hand -n argocd \
               -o jsonpath='{.metadata.labels.argocd-cluster-registrar/managed-by}' | grep -q .; then
            echo "::error::a hand-registered cluster Secret was relabelled as ours"
            exit 1
          fi
          kubectl delete namespace tenant-hand --wait=true
          kubectl delete secret cluster-hand -n argocd

      # Two namespaces claiming one name: the OLDER wins, and the winner must not
      # flap afterwards. `zzz-` is created first precisely so that alphabetical
      # order would give the wrong answer.
      - name: A contested cluster name goes to the oldest namespace and stays there
        run: |
          set -euo pipefail
          create_claimant() {
            ns="$1"; addr="$2"
            kubectl create namespace "$ns"
            kubectl label namespace "$ns" \
              argocd-cluster-registrar/managed-by=cluster-registrar \
              argocd-cluster-registrar/cluster=contested
            sed "s|https://192.0.2.10|https://192.0.2.${addr}|" \
              /tmp/kubeconfig.yaml > /tmp/"$ns".yaml
            kubectl create secret generic "k3k-$ns-kubeconfig" \
              -n "$ns" --from-file=kubeconfig.yaml=/tmp/"$ns".yaml
          }
          create_claimant zzz-first 31
          # Distinct creation timestamps; the API stores whole seconds.
          sleep 2
          create_claimant aaa-second 32

          sleep 20
          count="$(kubectl get secret -n argocd \
            -l argocd-cluster-registrar/cluster=contested -o name | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one registration for the contested name, got ${count}"
            kubectl get secret -n argocd -l argocd-cluster-registrar/cluster=contested
            exit 1
          fi
          owner() {
            kubectl get secret cluster-contested -n argocd \
              -o jsonpath='{.metadata.labels.argocd-cluster-registrar/source-namespace}'
          }
          if [ "$(owner)" != "zzz-first" ]; then
            echo "::error::contested name went to $(owner), want the older zzz-first"
            exit 1
          fi
          # The winner must survive several REVISITS, not merely several seconds.
          # Under a watch nothing re-runs unless RequeueAfter fires, so sleeping
          # and re-reading would pass just as happily if the reconciler had
          # stopped revisiting the key entirely -- which is the single most
          # dangerous regression this migration can produce. So count the
          # reconciles first and require that they actually happened.
          before="$(kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar \
            | grep -c 'refused to register cluster' || true)"
          sleep 20
          after="$(kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar \
            | grep -c 'refused to register cluster' || true)"
          if [ "$after" -le "$before" ]; then
            echo "::error::no reconcile happened in 20s at interval=5s; RequeueAfter is not being stamped"
            kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
            exit 1
          fi
          if [ "$(owner)" != "zzz-first" ]; then
            echo "::error::the winner flapped to $(owner)"
            exit 1
          fi
          # The registrar must stay up. Probes exist now, so a wedged manager also
          # shows as NotReady; restarts remain the cheapest signal.
          restarts="$(kubectl get pods -n registrar \
            -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}' | tr -d ' ')"
          if [ "$restarts" != "0" ]; then
            echo "::error::registrar restarted ${restarts} times while refusing a claim"
            kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
            exit 1
          fi
          kubectl delete namespace aaa-second --wait=true

      # A namespace deleted while nothing was running produces no event to catch
      # up on, so the startup seeder is the only thing that finds its
      # registration. Proven under envtest too, but here with real RBAC: the
      # seeder rebuilds its key set by LISTing owned Secrets, which the covering
      # role must actually permit.
      - name: A registration orphaned while the pod was down is collected on startup
        run: |
          set -euo pipefail
          dep=deployment/registrar-argocd-cluster-registrar
          kubectl create namespace k3k-downtime
          kubectl label namespace k3k-downtime \
            argocd-cluster-registrar/managed-by=cluster-registrar \
            argocd-cluster-registrar/cluster=downtime
          sed 's|https://192.0.2.10|https://192.0.2.51|' /tmp/kubeconfig.yaml > /tmp/downtime.yaml
          kubectl create secret generic k3k-downtime-kubeconfig \
            -n k3k-downtime --from-file=kubeconfig.yaml=/tmp/downtime.yaml
          for i in $(seq 1 12); do
            kubectl get secret cluster-downtime -n argocd >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl get secret cluster-downtime -n argocd >/dev/null

          # Down, THEN delete: the whole point is that no watch event is delivered.
          kubectl scale deployment -n registrar registrar-argocd-cluster-registrar --replicas=0
          kubectl wait --for=delete pod -n registrar \
            -l app.kubernetes.io/name=argocd-cluster-registrar --timeout=2m
          kubectl delete namespace k3k-downtime --wait=true
          kubectl get secret cluster-downtime -n argocd >/dev/null || {
            echo "::error::the registration vanished while nothing was running"; exit 1; }

          kubectl scale deployment -n registrar registrar-argocd-cluster-registrar --replicas=1
          kubectl rollout status -n registrar "$dep" --timeout=2m
          for i in $(seq 1 12); do
            if ! kubectl get secret cluster-downtime -n argocd >/dev/null 2>&1; then
              echo "collected after $((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::a registration orphaned during downtime was never collected"
          kubectl logs -n registrar "$dep" --tail=50
          exit 1

      # Taking a namespace out of scope is not a deletion, and a label-filtered
      # cache cannot tell the two apart: the apiserver reports an object that
      # stops matching the selector as a synthetic Delete. This is the scenario
      # where making the existence proof a cached read would deregister a live
      # cluster fleet-wide, which is why the proof goes to the apiserver.
      #
      # A broad regression guard rather than a sharp one: it is here to fail if
      # that read is ever switched to the cache, not to catch a one-line slip.
      - name: Removing the ownership label does not deregister anything
        run: |
          set -euo pipefail
          dep=deployment/registrar-argocd-cluster-registrar
          kubectl get secret cluster-capichild -n argocd >/dev/null
          kubectl label namespace capi-child argocd-cluster-registrar/managed-by-
          # Longer than interval=5s, so several reconciles see the namespace
          # out of scope rather than none.
          sleep 20
          kubectl get secret cluster-capichild -n argocd >/dev/null || {
            echo "::error::a registration was deleted when its namespace left scope"
            kubectl logs -n registrar "$dep" --tail=50; exit 1; }
          kubectl logs -n registrar "$dep" | grep -q 'no longer carries the ownership label' || {
            echo "::error::the namespace left scope without the controller noticing"
            kubectl logs -n registrar "$dep" --tail=50; exit 1; }
          kubectl label namespace capi-child argocd-cluster-registrar/managed-by=cluster-registrar

      # The contested-name step above proves the refusal happens and keeps
      # happening. This proves it is COUNTED, which is the half an operator can
      # alert on. Deliberately a separate step rather than a replacement: the log
      # count is what pins RequeueAfter, and losing it to a metric assertion would
      # trade one signal for another.
      #
      # Scraped through port-forward rather than a curl pod: the image is
      # distroless with no shell, and a second pod means an image pull in a job
      # that already has one.
      - name: A refused claim is counted under its own reason
        run: |
          set -euo pipefail
          kubectl port-forward -n registrar svc/registrar-argocd-cluster-registrar-metrics 18080:8080 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:18080/metrics -o /tmp/metrics.txt; then break; fi
            sleep 5
          done
          test -s /tmp/metrics.txt || { echo "::error::/metrics was never scrapeable"; exit 1; }

          series='argocd_cluster_registrar_conflicts_total{reason="incumbent"}'
          value=$(awk -v s="$series" '$0 ~ s {print $2}' /tmp/metrics.txt | tail -1)
          echo "$series = ${value:-<absent>}"
          if [ -z "${value:-}" ]; then
            echo "::error::the conflict counter is absent; it must be published at zero from startup"
            grep argocd_cluster_registrar /tmp/metrics.txt || true
            exit 1
          fi
          # A refusal happened in the step above, so this cannot legitimately be 0.
          if [ "$(printf '%.0f' "$value")" -lt 1 ]; then
            echo "::error::a refusal was logged but never counted"
            grep argocd_cluster_registrar /tmp/metrics.txt || true
            exit 1
          fi
          # The gauges come from the audit key, which is a different code path.
          grep -q 'argocd_cluster_registrar_registrations{state="active"}' /tmp/metrics.txt || {
            echo "::error::the registrations gauge was never set"; exit 1; }

      # Renaming demotes the old registration rather than deleting it. Worth doing
      # live because a real apiserver validates label values, and the demotion
      # stamps a timestamp -- RFC 3339 would be rejected for its colons.
      - name: A renamed cluster demotes its old registration, reversibly
        run: |
          set -euo pipefail
          kubectl label --overwrite namespace zzz-first \
            argocd-cluster-registrar/cluster=renamed
          for i in $(seq 1 12); do
            if kubectl get secret cluster-renamed -n argocd >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl get secret cluster-renamed -n argocd >/dev/null

          old="$(kubectl get secret cluster-contested -n argocd -o json)"
          if echo "$old" | jq -e '.metadata.labels."argocd.argoproj.io/secret-type"' >/dev/null; then
            echo "::error::the superseded registration is still visible to ArgoCD"
            exit 1
          fi
          echo "$old" | jq -e '.metadata.labels."argocd-cluster-registrar/superseded-by" == "cluster-renamed"' >/dev/null
          echo "$old" | jq -e '.metadata.labels."argocd-cluster-registrar/stale-since"' >/dev/null

          # Revert: the demoted registration must come back, not be recreated.
          kubectl label --overwrite namespace zzz-first \
            argocd-cluster-registrar/cluster=contested
          for i in $(seq 1 12); do
            if kubectl get secret cluster-contested -n argocd \
                 -o jsonpath='{.metadata.labels.argocd\.argoproj\.io/secret-type}' | grep -q cluster; then
              echo "restored after $((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::a reverted rename did not restore the demoted registration"
          kubectl get secret cluster-contested -n argocd -o jsonpath='{.metadata.labels}'; echo
          kubectl logs -n registrar deploy/registrar-argocd-cluster-registrar --tail=50
          exit 1
