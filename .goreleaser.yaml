version: 2

# Pinned explicitly. goreleaser otherwise derives ProjectName from the git
# REMOTE, not the module path, so a stale remote silently names every archive,
# checksum file and image label after the old repository.
project_name: argocd-cluster-registrar

before:
  hooks:
    - go mod tidy

builds:
  - id: app
    main: .
    binary: argocd-cluster-registrar
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{.CommitTimestamp}}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/pcanilho/argocd-cluster-registrar/cmd.version={{.Version}} -X github.com/pcanilho/argocd-cluster-registrar/cmd.commit={{.ShortCommit}} -X github.com/pcanilho/argocd-cluster-registrar/cmd.date={{.Date}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [zip]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"

snapshot:
  version_template: "{{.Tag}}-next"

# One SPDX document per archive. The images already carry one: ko generates it
# natively (kos.sbom defaults to spdx), which is why only the archives were
# uncovered. goreleaser has no built-in generator and shells out to syft, so the
# release workflow installs it.
sboms:
  - artifacts: archive

checksum:
  name_template: "{{.ProjectName}}_{{.Version}}_SHA256SUMS"
  algorithm: sha256

release:
  draft: false

# Release notes come from CHANGELOG.md, injected by the workflow via
# --release-notes. Generating a second set from commit subjects would either be
# ignored or appended as noise, so it is turned off here.
changelog:
  disable: true

kos:
  - id: app
    repositories:
      - ghcr.io/pcanilho/argocd-cluster-registrar
    main: .
    platforms:
      - linux/amd64
      - linux/arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/pcanilho/argocd-cluster-registrar/cmd.version={{.Version}} -X github.com/pcanilho/argocd-cluster-registrar/cmd.commit={{.ShortCommit}} -X github.com/pcanilho/argocd-cluster-registrar/cmd.date={{.Date}}"
    ko_data_creation_time: "{{.CommitTimestamp}}"
    labels:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.name: "{{.ProjectName}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      # Not {{.GitURL}}: that yields the SSH remote, which GHCR will not link.
      org.opencontainers.image.source: "https://github.com/pcanilho/argocd-cluster-registrar"
      org.opencontainers.image.licenses: "Apache-2.0"
      org.opencontainers.image.description: "Kubernetes controller that registers the clusters you run inside your cluster with ArgoCD, and removes them again when they are deleted"
    bare: true
    preserve_import_paths: false
    tags:
      - "{{.Version}}"
      # Not on a prerelease. Cutting v0.6.0-rc1 would otherwise republish latest
      # pointing at a release candidate, and the people tracking latest are
      # exactly the ones not using the chart, which pins a version.
      - "{{ if not .Prerelease }}latest{{ end }}"

docker_signs:
  - id: server
    args: ["sign", "--yes", "${artifact}"]
    artifacts: manifests
