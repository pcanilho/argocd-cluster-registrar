---
# Split into a cluster-scoped READ role and a namespaced WRITE role.
#
# The reads have to be cluster-wide: source Secrets live in one namespace per
# child, and RBAC cannot express "namespaces carrying label X".
#
# The writes do not. Everything this tool creates, updates or deletes lands in
# .Values.targetNamespace, so granting create/update/delete on Secrets across
# every namespace was a standing privilege-escalation path (overwrite
# argocd-secret, mint a token Secret for a privileged ServiceAccount, delete
# kube-system Secrets) bought for nothing.
#
# `patch` is still absent: apply() uses Get plus Create/Update with a carried
# resourceVersion, and demotion follows the same read-modify-write.
#
# `watch` is granted on namespaces ONLY. The controller watches namespaces and
# nothing else -- in particular it does not watch the provisioner-written
# kubeconfig Secrets, which would mean an informer over every Secret in the
# cluster that could not be narrowed (they carry none of our labels). Those are
# still read directly, which is why `get` appears below alongside `list`.
#
# Residual risk worth naming rather than hiding: cluster-wide Secret READ still
# lets this ServiceAccount read every credential in the cluster. That is inherent
# to label-driven discovery across arbitrary namespaces. What it does NOT do is
# hold them in memory: nothing Secret-shaped is ever cached.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "app.fullname" . }}-role
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # Discovery: find namespaces carrying the managed-by label, and confirm one is
  # genuinely gone before deregistering its cluster.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Read the provisioner-written kubeconfig Secrets in those namespaces. LIST
  # only: discovery cannot know a Secret's name in advance, it matches a glob, and
  # every Get this tool issues is inside targetNamespace and covered by the Role
  # below. Cluster-wide `get` would be a grant with no caller.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
# The write half, confined to the single namespace this tool ever writes to.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" . }}-write
  namespace: {{ .Values.targetNamespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
{{- if .Values.leaderElection.enabled }}
  # Leader election. The lock only ever does get/create/update, so list and watch
  # are not granted even though the usual scaffold includes them.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # The lock records an event on every acquire and renew. Without this the
  # election still works but logs an RBAC failure each time.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.fullname" . }}-write
  namespace: {{ .Values.targetNamespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "app.fullname" . }}-write
subjects:
  - kind: ServiceAccount
    name: {{ include "app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
