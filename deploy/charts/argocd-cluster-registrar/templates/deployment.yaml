---
# A Deployment, replacing the previous Job.
#
# The Job could only ever run at sync time, and a cluster is normally destroyed
# long after the last sync that created it -- so a Job can register a cluster but
# can never deregister one. Running continuously is also what re-reads kubeconfigs
# after a k3s server restart rotates its client certificate, which would otherwise
# leave an authenticating-but-stale cluster Secret behind.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection.enabled) }}
  {{- fail "replicaCount > 1 requires leaderElection.enabled. Two active instances sharing a managedBy value rewrite each other's provider label on every reconcile." }}
  {{- end }}
  # One by default. Two active replicas would not corrupt each other's Secrets --
  # neither will take over a registration the other holds -- but they would do the
  # same work twice, and rewrite each other's provider label if configured with
  # different providers. Leader election, not replica count, is what makes more
  # than one safe.
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      {{- with .Values.commonAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--target-namespace={{ .Values.targetNamespace }}"
            - "--label-prefix={{ .Values.labelPrefix }}"
            - "--managed-by={{ .Values.managedBy }}"
            {{- /*
              Emit EITHER the provider list OR the pre-0.3.0 scalars, never both.

              Setting both is a hard failure rather than a silent preference. Once
              two ways to say the same thing exist, quietly honouring one of them
              is how an upgrade ends up looking healthy while registering nothing:
              the operator sees their values in git, and the pod is hunting for
              something else entirely. `providers` is empty by default precisely so
              that "set" can be told apart from "defaulted" here.
            */}}
            {{- if and .Values.providers (or .Values.secretNamePattern .Values.secretKey) }}
            {{- fail "providers and secretNamePattern/secretKey are mutually exclusive. secretNamePattern/secretKey are deprecated; express them as a providers entry instead, e.g. providers: [{name: custom, secretNamePattern: 'vc-*', secretKeys: [config]}]" }}
            {{- end }}
            {{- if .Values.providers }}
            {{- range .Values.providers }}
            {{- if kindIs "string" . }}
            - "--provider={{ . }}"
            {{- else }}
            - "--provider={{ .name }}={{ .secretNamePattern }}={{ join "," .secretKeys }}"
            {{- end }}
            {{- end }}
            {{- else if or .Values.secretNamePattern .Values.secretKey }}
            - "--secret-name-pattern={{ required "secretNamePattern is required when secretKey is set" .Values.secretNamePattern }}"
            - "--secret-key={{ required "secretKey is required when secretNamePattern is set" .Values.secretKey }}"
            {{- end }}
            - "--interval={{ .Values.interval }}"
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            - "--leader-election-id={{ include "app.leaderElectionID" . }}"
            {{- end }}
            {{- if .Values.probes.enabled }}
            - "--health-probe-bind-address={{ .Values.probes.bindAddress }}"
            {{- else }}
            - "--health-probe-bind-address="
            {{- end }}
            {{- if .Values.dryRun }}
            - --dry-run
            {{- end }}
            {{- if .Values.debug }}
            - --debug
            {{- end }}
          {{- if .Values.probes.enabled }}
          ports:
            - name: probes
              containerPort: {{ .Values.probes.bindAddress | trimPrefix ":" | int }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
