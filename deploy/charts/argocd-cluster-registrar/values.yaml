---
# The namespace ArgoCD reads cluster Secrets from. ArgoCD only ever looks in its
# own namespace, so this is effectively always "argocd".
targetNamespace: argocd

# Prefix for the labels AND annotations read off the source namespace and copied
# onto the ArgoCD cluster Secret. Override it to fit an existing convention.
#
# Annotations carry what a label value cannot: a URL, a list, anything over 63
# bytes. The ApplicationSet cluster generator exposes both, but selects on labels
# only. Bounded, since the source namespace is tenant-controlled and the cluster
# Secret has to stay under the apiserver's 256KB annotation ceiling: 4KiB per
# value, 32KiB in total, 32 keys. Anything over is skipped and logged, never
# truncated.
labelPrefix: argocd-cluster-registrar/

# Value of the `<labelPrefix>managed-by` label that identifies both the namespaces
# to watch and the ArgoCD cluster Secrets this release owns. Give each release its
# own: two registrars sharing a value discover the same namespaces and do the same
# work twice. They do not corrupt each other -- neither will take over a
# registration the other holds -- but if they are configured with different
# `providers` they rewrite each other's `<labelPrefix>provider` label on every
# reconcile, forever. `leaderElection` is the fix if you must run two.
#
# Changing this later orphans every Secret already registered. It is part of the
# ownership record, so the new instance refuses to adopt them and garbage
# collection no longer selects them. See "Changing managedBy or labelPrefix" in
# the README.
managedBy: cluster-registrar

# Provisioners to look for, in precedence order. Order matters, because the
# patterns legitimately overlap: `capi` matches `*-kubeconfig`, which includes
# k3k's Secret. Correctness comes from the key, not the name.
#
# `secretKeys` is ordered too. Every declared key present on a Secret is tried in
# turn and the first that parses wins, so a half-written or otherwise unusable key
# falls through to the next rather than stranding the namespace. Put the key you
# prefer first: Kamaji's `admin.conf` and `admin.svc` both normally parse, so the
# declared order is what decides between them.
#
# Built-in presets: k3k, vcluster, kamaji, capi, capa-eks, capz-aks. A custom
# shape can be spelled out in full instead:
#
#   providers:
#     - k3k
#     - name: mytool
#       secretNamePattern: "mytool-*-kubeconfig"
#       secretKeys: [kubeconfig]
#       # Optional. Permits translating an exec credential found in this shape,
#       # and only takes effect with execCredentials: true below. Set it only on
#       # shapes that are exec-bearing by construction.
#       allowExec: false
#
# Matching by name rather than by label is deliberate: the provisioner creates
# that Secret, so it carries none of our labels and there is nowhere to add them.
#
# On `capi`: it is the MANDATORY Cluster API control-plane contract
# (`<cluster>-kubeconfig`, key `value`), so one entry covers any CAPI cluster
# whatever the infrastructure provider, plus standalone k0smotron.
#
# Managed cloud control planes need `capa-eks` or `capz-aks` as well, plus
# `execCredentials: true`, and the managed preset must be declared FIRST.
# CAPA and CAPZ write two Secrets: the CAPI-contract one holds a token good for
# about 15 minutes, the other an exec credential that gets translated into
# ArgoCD's own argocd-k8s-auth configuration and does not expire that way.
#
# Empty by default, and that is load-bearing rather than an oversight. Helm
# coalesces chart defaults into every user's values, so a non-empty default here
# would be indistinguishable from a deliberate setting: a 0.2.x values file that
# sets only `secretNamePattern`/`secretKey` and never mentions `providers` would
# still take the branch below and have those two silently ignored. Leaving this
# empty lets the binary supply the default instead, where it can tell "unset"
# from "set to k3k". Unset, the binary uses `k3k`.
providers: []

# Translate exec credential plugins (EKS, AKS) into ArgoCD's argocd-k8s-auth
# configuration. Off by default, and only affects providers that allow it.
#
# A translated registration makes ArgoCD authenticate as itself, with its own
# IRSA or workload identity, rather than with a credential from the source
# namespace. Access is then governed on the cloud side against ArgoCD's
# principal, which this tool neither sees nor revokes when the namespace is
# deleted. Turn it on only if that is what you want.
execCredentials: false

# Superseded by `providers`, kept so a 0.2.x values file keeps working unchanged.
# Set BOTH or neither. If `providers` is also set the chart fails rather than
# guessing, because preferring either one silently is how an upgrade quietly
# stops registering anything.
secretNamePattern: ""
secretKey: ""

# How long before a settled cluster is looked at again.
#
# This is not how quickly a new cluster is registered or a deleted one removed:
# both are driven by namespace events now and happen as fast as the apiserver
# delivers one. What this bounds is credential freshness -- a k3s server restart
# rotates the child's client certificate, and until the registration is re-read
# ArgoCD is holding the old one. Lowering it no longer speeds anything else up.
interval: 60s

# Delete a demoted registration once it has been superseded this long. 0 keeps
# it indefinitely, which is the behaviour before 0.5.0.
#
# A rename hides the old registration from ArgoCD rather than deleting it, so
# reverting the rename restores it. The debris accumulates until its namespace
# is deleted; this bounds that, at the cost of bounding how long a revert works.
# Expiry only happens while the source namespace is alive and registered under
# another name, and no sooner than `interval`.
demotedTTL: 0s

# Log intended changes without writing. Worth using when first pointing this at
# an existing cluster, to confirm the GC selector matches only what you expect.
dryRun: false
debug: false

# Only reconcile while holding a lease, so two instances configured identically
# do not both run. Off by default: enabling it needs RBAC for leases and events
# in `targetNamespace`, which is often a namespace someone else owns.
#
# The lease is named for `labelPrefix` and `managedBy` rather than for the Helm
# release, because those are what decide whether two instances collide at all --
# ownership is established purely by label. Two releases differing only in name
# contend for the same Secrets and must contend for the same lease.
leaderElection:
  enabled: false

# /healthz and /readyz. Readiness means the manager is running, not that this
# replica is the leader, so a standby stays Ready.
probes:
  enabled: true
  # ":PORT" only. The container port is derived from this by stripping the colon,
  # so "0.0.0.0:8081" would render containerPort 0. The chart rejects anything else.
  bindAddress: ":8081"
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

# Prometheus metrics. Four series, all counts of this instance's own decisions:
# registrations refused and why, orphans adopted, registrations owned by state
# and remaining credential lifetime,
# and owned Secrets that no reconcile key can reach.
#
# OFF by default, and served UNAUTHENTICATED when on. Protecting the endpoint
# means controller-runtime's authn/authz filter, which pulls in k8s.io/apiserver
# and needs `tokenreviews`/`subjectaccessreviews` RBAC. Nothing published here
# carries a cluster name, a namespace or any credential, so a NetworkPolicy is
# the proportionate control. Which cluster is contested stays in the logs, where
# it does not become unbounded monitoring cardinality anyone able to label a
# namespace could mint.
#
# No ServiceMonitor ships. It needs a CRD that `helm template` cannot check for,
# so it could not be proven correct in CI. Point your scrape config at the
# Service, or add a ServiceMonitor of your own.
metrics:
  enabled: false
  # ":PORT" only, as with probes.bindAddress above.
  bindAddress: ":8080"
  service:
    enabled: false
    port: 8080
    annotations: {}

# One is the right number. There is no work to parallelise and no HA requirement;
# a brief outage of this controller costs nothing, since it converges on restart.
# More than one requires leaderElection.enabled, or they would rewrite each
# other's provider labels forever.
replicaCount: 1

strategy:
  type: Recreate

# controller-runtime waits up to 30s for a graceful shutdown, which is exactly the
# pod default, so leave headroom or the drain is SIGKILLed halfway.
terminationGracePeriodSeconds: 40

# Internals
commonAnnotations: ~
commonLabels: ~

image:
  repository: ghcr.io/pcanilho/argocd-cluster-registrar
  # Empty on purpose: defaults to .Chart.AppVersion. The release workflow
  # repackages the chart with --app-version from the git tag but does not touch
  # this file, so a hardcoded tag here would quietly ship the previous image
  # alongside a new chart. Set it only to pin against the chart's own version.
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# A ValidatingAdmissionPolicy constraining who may set the two labels that
# authorize a registration. Off by default.
#
# This is the enforcement point the README's security section describes. The
# labels are policy input, not decoration, and Kubernetes cannot gate a label key
# through RBAC alone: whoever can create a namespace sets its labels at creation.
#
# Needs Kubernetes 1.30 or later, where ValidatingAdmissionPolicy reached v1. The
# chart checks and fails the render below that: leaving it to the apiserver means
# helm failing the whole release on "no matches for kind", deployment included.
#
# The check reads Helm's KubeVersion, which is a default when there is no cluster
# to ask and tracks the Helm release. Rendering offline under Helm 3.14 or older
# therefore refuses this policy whatever your cluster runs; use Helm 3.15+ or
# pass --kube-version. install, upgrade and ArgoCD all discover the real version.
admissionPolicy:
  enabled: false

  # Warn and Audit first. Watch the audit log, then set ["Deny", "Audit"]. The
  # policies themselves need no edit; only this list changes.
  validationActions: ["Warn", "Audit"]

  # Governs CEL evaluation errors, not a validation returning false. Under Fail,
  # a null-guard slip in a policy denies every namespace write, which is the
  # second reason to start on Warn.
  failurePolicy: Fail

  # Who may set <labelPrefix>managed-by. At least one of these is required when
  # the policy is enabled: with neither, nothing may set the label and every
  # namespace carrying it is refused. The chart fails the render rather than
  # letting that reach a cluster.
  #
  #   authorizedGroups: ["cluster-admins", "platform"]
  #   authorizedUsers:  ["system:serviceaccount:argocd:argocd-application-controller"]
  #
  # Remember a controller-created namespace authenticates as its ServiceAccount,
  # never as the human who merged the change, so any controller that labels
  # namespaces needs listing here.
  #
  # Listing one is transitive, and that is the mistake worth avoiding: the policy
  # matches on username, so a controller listed here may set the label on every
  # namespace it creates. A self-service provisioner that passes caller-supplied
  # labels through therefore hands the label to everyone it serves and the policy
  # stops meaning anything. Give such a controller a narrower path for the label
  # instead of listing the one it uses for tenant requests.
  #
  # Note this constrains <labelPrefix>managed-by, and optionally
  # <labelPrefix>cluster below. The other prefixed labels propagate as written,
  # and those are what an ApplicationSet selects on.
  #
  # Kubernetes' authorizer CEL library allows a neater indirection -- grant a verb
  # on a resource nothing serves, and onboarding becomes a ClusterRoleBinding
  # rather than an edit to this file. It is deliberately not used: the method
  # chain could not be verified here, and an unverified expression has no place
  # in a security control. Worth revisiting against a live cluster.
  authorizedGroups: []
  authorizedUsers: []

  # Also require <labelPrefix>cluster to equal the namespace name, so a namespace
  # cannot claim a cluster name unrelated to itself.
  clusterNameMustMatchNamespace: false
